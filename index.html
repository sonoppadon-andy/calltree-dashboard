<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call Tree Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0}.container{padding:20px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.num{font-size:32px;font-weight:bold}.panel{background:#fff;padding:20px;margin-top:15px;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}@media(max-width:768px){.cards,.grid{grid-template-columns:1fr}}</style></head><body><div class="container"><h1>Call Tree Dashboard</h1><p>GitHub Pages Ready</p><div class="cards"><div class="card"><div>Total</div><div class="num" id="total"></div></div><div class="card"><div>Safe</div><div class="num" id="safe"></div></div><div class="card"><div>Pending</div><div class="num" id="pending"></div></div><div class="card"><div>Response %</div><div class="num" id="rate"></div></div></div><div class="grid"><div class="panel"><canvas id="statusChart"></canvas></div><div class="panel"><canvas id="drillChart"></canvas></div></div><div class="panel"><h3>Latest Responses</h3><table><thead><tr><th>Member</th><th>Status</th><th>RefID</th></tr></thead><tbody id="tbl"></tbody></table></div></div><script src="app.js"></script></body></html>
